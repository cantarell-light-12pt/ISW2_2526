project.name=ZOOKEEPER
project.jira.baseUrl=https://issues.apache.org/jira/rest/api/2
project.jira.versionsParameterizedPath=%s/project/%s/versions
project.repo.url=https://github.com/apache/zookeeper
project.repo.basePath=/tmp/repos
project.repo.forceOverwrite=false
project.tags.prefix=release-
# Method used to estimate the injected version of the issues that do not report it: simple | incremental
project.proportion.method=incremental
# Directories holding sources that are not functional code, and are therefore no rows of the dataset.
# Matched against every segment of the path of a source file, relative to the root of the repository
project.metrics.excludedDirectories=.git,test,tests,target,build,generated
# Sources that are not functional code either, matched as globs against the name of the file alone
project.metrics.excludedFiles=package-info.java,module-info.java,Info.java,*Test.java,*Tests.java,*TestCase.java,*IT.java
# Code smells are counted by running PMD over the sources of each release, in a container, so that
# neither PMD nor a Java runtime able to host it has to be installed. It has to be a PMD 7 image: it is
# the only line able to parse every Java version the releases of the project were compiled against.
# The version is pinned, and not followed at latest, because the smell counts of two releases are only
# comparable if the engine that produced them was the same one
project.metrics.pmd.image=pmdcode/pmd:7.26.0
# The rules whose violations are counted as smells, as a resource of this project rather than one of the
# PMD distribution, for that same reason
project.metrics.pmd.ruleset=pmd-ruleset.xml
# Java version the sources of a release are parsed as when its build files do not say which one it was
# compiled against
project.metrics.pmd.defaultJavaVersion=8
# How long the analysis of a single release may take before it is abandoned
project.metrics.pmd.timeoutSeconds=1800
# Where the dataset is written. The file is named after the project, so that pointing the pipeline at
# another one does not overwrite the dataset already built. The rows of a release are appended as soon
# as it has been measured, rather than when the whole history has been: a full run takes hours, and the
# releases already analysed are worth keeping when a later one cannot be measured
project.dataset.outputDirectory=dataset
# Which part of the release history the trimmed dataset holds, written beside the whole one as
# <project>-trimmed.csv. Both come out of the same run and out of the same measures: the whole history
# is hours of mining and is what the trimmed one is read against. The releases kept are the earliest by
# release date, i.e. the first ordinals the versions were numbered with, and not the first by name -
# a project maintaining several lines at once publishes 3.5.10 after 3.6.0. The count rounds to the
# nearest whole release, since a release is measured or it is not: 33% of the 61 releases ZooKeeper had
# tagged at the last run is 20.13 of them, so the trimmed dataset holds 20, up to and including 3.4.4
project.dataset.trimFraction=0.33
# Which models are trained on the trimmed dataset and measured over its folds, as a comma-separated
# list read in the order it is written. This is configuration rather than code precisely because the
# comparison is meant to grow: RandomForest,NaiveBayes,IBk is the whole of what running the three of
# them takes, and the three answer to the shape of a dataset differently enough that comparing them
# says what a single one would not. Accepted values: RandomForest | NaiveBayes | IBk
project.ml.classifiers=RandomForest
# Which share of the releases a model is trained on, the rest being held back to test it on. Two thirds,
# rounded to the nearest whole release - a release is trained on or it is not: of the 20 releases the
# trimmed dataset holds, 13 are trained on (3.0.0 through 3.4.0) and 7 are tested on (3.3.4 through
# 3.4.4), which are 2538 and 1774 rows.
# The cut falls at a release and never at a row, and what that buys is a direction in time rather than
# less overlap. A long-lived class sits in both halves either way, which is no fault: the earlier
# releases of a class are the history a predictor legitimately has when asked about the next one. A
# random row split instead lets the model read a class's FUTURE - release 8 of it in the training set,
# release 7 in the test set - and a near-identical row carrying the answer, from a release that had not
# happened yet, is information nobody could ever have had. Cutting at a point in time makes every
# training row older than every test row, which is the only arrangement under which the figure means
# "how well would this have predicted what came next". Older is by release DATE, not by name: the
# project publishes 3.4.0 before 3.3.4, so the training set ends at 3.4.0 and the test set opens at
# 3.3.4, which reads oddly and is correct
project.ml.trainingFraction=0.67
# How many folds each model is cross-validated over, of the TRAINING releases alone - the test ones are
# not read until the inference phase. The rows are shuffled and stratified first, so every fold holds
# the buggy share of the whole, which matters here since only some 23% of them are buggy and an
# unstratified tenth could hold very few. Read the validation figures as an upper bound and the test
# ones as the answer: these folds are cut at random, so a class of one training release sits in the
# training part while the same class of the next sits in the test part, barely changed and equally
# labelled. That is what the release-aware split above exists to keep out of the final figure
project.ml.folds=10
# What every random choice is drawn from: the folds and the forests. Fixed, so that two runs of the
# same model report the same numbers
project.ml.seed=42
# The class precision, recall, F1 and AUC are read of, as it reads in the dataset. Of the buggy class
# alone and never averaged over the two: 77% of the rows are not buggy, so a model finding none of them
# already scores .77 accuracy, and only the figures of the minority class say that it found nothing
project.ml.positiveClass=1
# How many threads a model that can spread itself may use. Zero means one per available processor,
# which is the whole machine - the models are measured one after another, so nothing competes with it
project.ml.threads=0
# How each of the models that has anything to configure is built
project.ml.randomForest.iterations=100
project.ml.ibk.neighbours=3