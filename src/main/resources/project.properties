project.name=ZOOKEEPER
project.jira.baseUrl=https://issues.apache.org/jira/rest/api/2
project.jira.versionsParameterizedPath=%s/project/%s/versions
project.repo.url=https://github.com/apache/zookeeper
project.repo.basePath=/tmp/repos
project.repo.forceOverwrite=false
project.tags.prefix=release-
# Method used to estimate the injected version of the issues that do not report it: simple | incremental
project.proportion.method=incremental
# Directories holding sources that are not functional code, and are therefore no rows of the dataset.
# Matched against every segment of the path of a source file, relative to the root of the repository
project.metrics.excludedDirectories=.git,test,tests,target,build,generated
# Sources that are not functional code either, matched as globs against the name of the file alone
project.metrics.excludedFiles=package-info.java,module-info.java,Info.java,*Test.java,*Tests.java,*TestCase.java,*IT.java
# Code smells are counted by running PMD over the sources of each release, in a container, so that
# neither PMD nor a Java runtime able to host it has to be installed. It has to be a PMD 7 image: it is
# the only line able to parse every Java version the releases of the project were compiled against.
# The version is pinned, and not followed at latest, because the smell counts of two releases are only
# comparable if the engine that produced them was the same one
project.metrics.pmd.image=pmdcode/pmd:7.26.0
# The rules whose violations are counted as smells, as a resource of this project rather than one of the
# PMD distribution, for that same reason
project.metrics.pmd.ruleset=pmd-ruleset.xml
# Java version the sources of a release are parsed as when its build files do not say which one it was
# compiled against
project.metrics.pmd.defaultJavaVersion=8
# How long the analysis of a single release may take before it is abandoned
project.metrics.pmd.timeoutSeconds=1800
# Where the dataset is written. The file is named after the project, so that pointing the pipeline at
# another one does not overwrite the dataset already built. The rows of a release are appended as soon
# as it has been measured, rather than when the whole history has been: a full run takes hours, and the
# releases already analysed are worth keeping when a later one cannot be measured
project.dataset.outputDirectory=dataset
# Which part of the release history the models are studied on. The extraction writes every release to
# <project>.csv, and MlMain trims it to the earliest share of its releases and writes those as
# <project>-trimmed.csv, which the balancing and feature selection studies read: MlMain has to have run
# before them. The tail is dropped because the buggy label of a release is only as good as the defects
# reported against it, and the last releases have had the least time to have any reported. The releases
# kept are the earliest by release date, i.e. the order the extraction wrote them in, and not the first
# by name - a project maintaining several lines at once publishes 3.5.10 after 3.6.0. The count rounds
# to the nearest whole release, since a release is kept or it is not: 33% of the 61 releases ZooKeeper
# had tagged at the last run is 20.13 of them, so the trimmed dataset holds 21, up to and including 3.4.5
project.ml.trimFraction=0.33
# Which models are trained on the trimmed dataset and measured over its folds, as a comma-separated
# list read in the order it is written. This is configuration rather than code precisely because the
# comparison is meant to grow: RandomForest,NaiveBayes,IBk is the whole of what running the three of
# them takes, and the three answer to the shape of a dataset differently enough that comparing them
# says what a single one would not. Accepted values: RandomForest | NaiveBayes | IBk
project.ml.classifiers=RandomForest,NaiveBayes,IBk
# How the two classes of the rows a model is TRAINED on are brought to the same size, as a
# comma-separated list read in the order it is written: every model is measured under every technique on
# it, in both phases, and the report tells the runs apart by a Balancing column. Of the training rows
# alone, and never of the ones a model is measured on: balancing is a way of telling a model what to pay
# attention to, so it belongs where the model is taught, while resampling the test rows would change the
# population the figure is an estimate of, and the figure would stop estimating anything the project can
# be reported on. That holds inside the validation as well - each fold balances the nine tenths it trains
# on and measures the tenth it held out as it is - since balancing the training releases before cutting
# the folds would have SMOTE synthesise rows out of classes a fold then tests on.
# Some 23% of the rows are buggy, which is enough for a model finding none of them to score .77
# accuracy. The two techniques close that gap from opposite ends and pay for it in opposite ways:
# Undersampling cuts the majority down to the size of the minority and throws away most of what could
# have been learnt about the classes nobody ever fixed a defect in, so a recall bought there is usually
# paid for in precision; SMOTE synthesises the minority back up to the size of the majority, each new row
# lying between a buggy class and one of its five nearest buggy neighbours, which shows the model classes
# no release of the project ever held. None is the rows as they are, and is what the other two are read
# against. Both draws are seeded from project.ml.seed, so two runs of a technique resample the same rows.
# Accepted values: None | Undersampling | SMOTE
project.ml.balancing=None,Undersampling,SMOTE
# Which attributes of the rows a model is TRAINED on it keeps, as a comma-separated list read in the
# order it is written: every model is measured under every technique on it, crossed with
# every technique of project.ml.balancing, and the report tells the runs apart by a FeatureSelection
# column. Chosen out of the training rows alone, for the reason they alone are balanced - inside the
# validation, each fold chooses out of the nine tenths it trains on - and chosen before they are
# balanced, so that the rows SMOTE synthesises have no say in which attributes the real ones are told
# apart by. The rows a model is measured on are only ever reduced to what was chosen.
# The metrics are far from independent - the size metrics move together, the history ones are counts of
# the same commits read several ways - and the three models pay for that differently: naive Bayes counts
# a redundant metric twice, IBk adds an uninformative one to every distance it measures, and a forest is
# expected to shrug. InfoGain ranks each attribute on its own by how much it tells of the label and keeps
# the best project.ml.featureSelection.infoGainAttributes of them; ForwardSearch and BackwardSearch walk
# greedily through subsets, from no attribute up or from all of them down, judging a subset by how well
# its attributes predict the label and how little they predict each other (CFS). None is every
# attribute, and is what the other three are read against.
# Accepted values: None | InfoGain | ForwardSearch | BackwardSearch
project.ml.featureSelection=None,InfoGain,ForwardSearch,BackwardSearch
# How many attributes a selection by information gain keeps, the best by the gain first. A count rather
# than a threshold on the gain: every metric of the dataset tells something of the label, so the
# threshold Weka defaults to keeps all of them, and a gain in bits means something different on every
# dataset it is read off. Ten is about as many as the two searches keep of the training releases - nine
# of them - so that the three selections differ in which attributes they keep rather than in how many
project.ml.featureSelection.infoGainAttributes=10
# Which share of the releases a model is trained on, the rest being held back to test it on. Two thirds,
# rounded to the nearest whole release - a release is trained on or it is not: of the 20 releases the
# trimmed dataset holds, 13 are trained on (3.0.0 through 3.4.0) and 7 are tested on (3.3.4 through
# 3.4.4), which are 2538 and 1774 rows.
# The cut falls at a release and never at a row, and what that buys is a direction in time rather than
# less overlap. A long-lived class sits in both halves either way, which is no fault: the earlier
# releases of a class are the history a predictor legitimately has when asked about the next one. A
# random row split instead lets the model read a class's FUTURE - release 8 of it in the training set,
# release 7 in the test set - and a near-identical row carrying the answer, from a release that had not
# happened yet, is information nobody could ever have had. Cutting at a point in time makes every
# training row older than every test row, which is the only arrangement under which the figure means
# "how well would this have predicted what came next". Older is by release DATE, not by name: the
# project publishes 3.4.0 before 3.3.4, so the training set ends at 3.4.0 and the test set opens at
# 3.3.4, which reads oddly and is correct
project.ml.trainingFraction=0.67
# Which share of the TRAINING releases the balancing study (BalancingStudyMain) trains on, the rest of
# them being what the balancing techniques are compared over. The study never reads the test releases
# the previous property sets aside: a technique chosen because it scored best on them has been fitted to
# them by hand, and the test figure measured under it would stop estimating anything. So the training
# releases are cut in two again, in time order like the first cut - two thirds, rounded to the nearest
# whole release, of the 14 training releases is 9 to train on and 5 to compare over - and every model is
# trained on the first under every technique of project.ml.balancing and measured on the second
project.ml.balancingStudy.trainingFraction=0.66
# How many folds each model is cross-validated over, of the TRAINING releases alone - the test ones are
# not read until the inference phase. The rows are shuffled and stratified first, so every fold holds
# the buggy share of the whole, which matters here since only some 23% of them are buggy and an
# unstratified tenth could hold very few. Read the validation figures as an upper bound and the test
# ones as the answer: these folds are cut at random, so a class of one training release sits in the
# training part while the same class of the next sits in the test part, barely changed and equally
# labelled. That is what the release-aware split above exists to keep out of the final figure
project.ml.folds=10
# What every random choice is drawn from: the folds and the forests. Fixed, so that two runs of the
# same model report the same numbers
project.ml.seed=42
# The class precision, recall, F1 and AUC are read of, as it reads in the dataset. Of the buggy class
# alone and never averaged over the two: 77% of the rows are not buggy, so a model finding none of them
# already scores .77 accuracy, and only the figures of the minority class say that it found nothing
project.ml.positiveClass=1
# How many threads a model that can spread itself may use. Zero means one per available processor,
# which is the whole machine - the models are measured one after another, so nothing competes with it
project.ml.threads=0
# How each of the models that has anything to configure is built
project.ml.randomForest.iterations=100
project.ml.ibk.neighbours=3