project.name=ZOOKEEPER
project.jira.baseUrl=https://issues.apache.org/jira/rest/api/2
project.jira.versionsParameterizedPath=%s/project/%s/versions
project.repo.url=https://github.com/apache/zookeeper
project.repo.basePath=/tmp/repos
project.repo.forceOverwrite=false
project.tags.prefix=release-
# Method used to estimate the injected version of the issues that do not report it: simple | incremental
project.proportion.method=incremental
# Directories holding sources that are not functional code, and are therefore no rows of the dataset.
# Matched against every segment of the path of a source file, relative to the root of the repository
project.metrics.excludedDirectories=.git,test,tests,target,build,generated
# Sources that are not functional code either, matched as globs against the name of the file alone
project.metrics.excludedFiles=package-info.java,module-info.java,Info.java,*Test.java,*Tests.java,*TestCase.java,*IT.java
# Code smells are counted by running PMD over the sources of each release, in a container, so that
# neither PMD nor a Java runtime able to host it has to be installed. It has to be a PMD 7 image: it is
# the only line able to parse every Java version the releases of the project were compiled against.
# The version is pinned, and not followed at latest, because the smell counts of two releases are only
# comparable if the engine that produced them was the same one
project.metrics.pmd.image=pmdcode/pmd:7.26.0
# The rules whose violations are counted as smells, as a resource of this project rather than one of the
# PMD distribution, for that same reason
project.metrics.pmd.ruleset=pmd-ruleset.xml
# Java version the sources of a release are parsed as when its build files do not say which one it was
# compiled against
project.metrics.pmd.defaultJavaVersion=8
# How long the analysis of a single release may take before it is abandoned
project.metrics.pmd.timeoutSeconds=1800
# Where the dataset is written. The file is named after the project, so that pointing the pipeline at
# another one does not overwrite the dataset already built. The rows of a release are appended as soon
# as it has been measured, rather than when the whole history has been: a full run takes hours, and the
# releases already analysed are worth keeping when a later one cannot be measured
project.dataset.outputDirectory=dataset
# Which part of the release history the trimmed dataset holds, written beside the whole one as
# <project>-trimmed.csv. Both come out of the same run and out of the same measures: the whole history
# is hours of mining and is what the trimmed one is read against. The releases kept are the earliest by
# release date, i.e. the first ordinals the versions were numbered with, and not the first by name -
# a project maintaining several lines at once publishes 3.5.10 after 3.6.0. The count rounds to the
# nearest whole release, since a release is measured or it is not: 33% of the 61 releases ZooKeeper had
# tagged at the last run is 20.13 of them, so the trimmed dataset holds 20, up to and including 3.4.4
project.dataset.trimFraction=0.33
# How many folds the classifiers are cross-validated over. Each classifier is measured three times over
# these folds - on the metrics a forward search kept, on the ones a backward search kept, and on every
# metric there is - and the three are what the comparison is made of. The selection is re-run inside
# each fold, on its training part alone, so that nothing the search saw is what it is then measured on
project.featureselection.folds=10
# What every random choice of the analysis is drawn from: the folds, the forests, and the samples the
# wrapper searches over. Fixed, so that two runs of the same configuration report the same numbers
project.featureselection.seed=1
# How many configurations are measured at once. Zero means one per available processor
project.featureselection.threads=0
# What the search maximises, and the class a per-class measure is read of. Accuracy, because that is
# what the comparison is finally reported on and a subset chosen by one measure and judged by another
# would need explaining. Be aware of what it costs: 85% of the rows are not buggy, so a classifier
# finding none of them already scores .85, the candidate subsets are separated by very little, and the
# search is free to keep almost anything. Setting this to AUC sharpens the search at the price of that
# mismatch. Accepted values: ACCURACY | AUC | AUPRC | FMEASURE
project.featureselection.wrapper.measure=ACCURACY
project.featureselection.wrapper.positiveClass=1
# How the cost of the search is bounded. It cross-validates its classifier once per candidate subset,
# of which a greedy search tries hundreds, inside each fold, for each of the three classifiers.
# A negative threshold is Weka's switch for a single cross-validation per subset instead of up to five;
# the sample is drawn stratified from the training fold, and decides which subset wins but never what
# it scores, since a subset is always measured by training on the whole fold
project.featureselection.wrapper.folds=3
project.featureselection.wrapper.threshold=-1
project.featureselection.wrapper.trainingSampleSizePercent=15
# The classifiers compared. The very same settings drive the searches, so that the subset each
# classifier is measured on is the one a search around that same classifier chose
project.featureselection.randomForest.iterations=100
project.featureselection.ibk.neighbours=3